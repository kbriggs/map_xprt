[tool.poetry]
name = "map_xprt"
version = "0.1.0"
description = ""
authors = ["Kieron Briggs <kbriggs@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.8"
google-api-python-client = "^2.58.0"
google-auth-oauthlib = "^0.5.2"
requests = "^2.28.1"
tomli = "^2.0.1"
awscrt = "^0.14.0"
boto3 = {extras = ["crt"], version = "^1.24.60"}
# Also requres the native libcairo2; e.g. sudo apt install libcairo2
CairoSVG = "^2.5.2"
Pillow = "^9.2.0"

[tool.poetry.dev-dependencies]
pytest = "^5.2"
flake8 = "^5.0.4"
black = "^22.6.0"
mypy = "^0.971"
types-requests = "^2.28.9"
google-api-python-client-stubs = "^1.11.0"
boto3-stubs = {extras = ["essential"], version = "^1.24.60"}
types-Pillow = "^9.2.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
