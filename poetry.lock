[[package]]
name = "awscrt"
version = "0.14.0"
description = "A common runtime for AWS Python projects"
category = "main"
optional = false
python-versions = ">=3.6"

[[package]]
name = "black"
version = "22.6.0"
description = "The uncompromising code formatter."
category = "dev"
optional = false
python-versions = ">=3.6.2"

[package.dependencies]
click = ">=8.0.0"
mypy-extensions = ">=0.4.3"
